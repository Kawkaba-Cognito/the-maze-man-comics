ext {
    /*
     * Capacitor 7 baseline, and — critically — targetSdk 35.
     *
     * Google Play has REQUIRED targetSdk 35 for new apps and updates since
     * 31 Aug 2025. This project sat at 34 (the Capacitor 6 ceiling), so an
     * upload would have been refused at submission, not at review. That is the
     * only hard blocker on the Play path; everything else in capacitor.config
     * (https scheme, no cleartext, no mixed content, debugging off) was already
     * correct.
     *
     * minSdk 23 is Capacitor 7's floor, up from 22.
     */
    minSdkVersion = 23
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}
