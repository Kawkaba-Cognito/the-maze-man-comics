name: Deploy to GitHub Pages

# Primary deploy path: every push to main builds on a clean runner and
# publishes dist/ to the gh-pages branch (the branch GitHub Pages serves —
# repo Pages config is "Deploy from a branch", build_type "legacy"; this
# workflow deliberately keeps that config instead of the Actions-artifact
# flow, so the manual worktree deploy in CLAUDE.md still works as a fallback).
# Plain git only — no third-party actions in the publish step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

concurrency:
  group: pages-deploy
  cancel-in-progress: false # never kill a deploy mid-push; queue the next one

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Secrets, .gitignore integrity, CSP ratchet, SRI pins, network isolation,
      # XSS sinks, npm audit — all against scripts/security-baseline.json. Runs
      # FIRST: if a credential is in the tree, nothing else about this build
      # matters. See SECURITY.md for what each rule means.
      - name: Security audit
        run: npm run audit:sec

      # Reports only — see ci.yml for why this must never gate a deploy.
      - name: Review board (delta since last acknowledged state)
        run: npm run review:since || true

      # The curated short-word dictionary, both directions (junk rejected, real
      # words accepted) AND that every level is still winnable after tightening.
      - name: Validate Word Maze dictionary
        run: npm run validate:wordmaze

      # No game may outrun the player. Asserts the ms-per-stimulus FLOOR a human
      # actually meets at every level and survival stage — three games had been
      # ramped to 650ms/520ms/150ms, which measured reading speed, not the
      # construct. Same failure family as audit:fq below.
      - name: Audit game pacing floors
        run: npm run audit:pacing

      # Story Time's retrieval half is GENERATED — Kawkab's questions are derived
      # from whichever story was dealt. A generator can emit a question with two
      # right answers, or a "did you see this scene?" lure that shows a real
      # scene while the answer says it never happened; neither is visible from
      # playing one round. This re-derives every answer from the beats.
      - name: Validate Story Time's generated questions
        run: npm run validate:storyq

      # Detective is fully generated: suspects, statements, a rule and a
      # question, dealt at runtime. A generator can emit a case with no
      # consistent world (unanswerable), or several worlds where the question
      # has different answers in each (ambiguous) — and the player would just
      # lose and assume they reasoned badly. This re-solves every case
      # independently, and asserts the question mix stays varied.
      - name: Validate Detective's generated cases
        run: npm run validate:liars

      # The Gate's whole promise is that the law can be DEDUCED from the probes
      # it grants. A tray that never separates the trio turns the final choice
      # into a 1-in-3 guess wearing a puzzle's clothes, and a player who cannot
      # work it out simply assumes they reasoned badly. This re-derives the
      # fairness of every generated gate with an independent enumerator, and
      # asserts no half-tier is inert.
      - name: Validate The Gate's generated gates
        run: npm run validate:gatekeeper

      - name: Audit FocusQuest level math & generation
        run: npm run audit:fq

      - name: Validate rush-hour reference solutions
        run: npm run validate:rh

      # Target Tracking's tiers must chain, so difficulty never falls at a seam,
      # and no tier may ask for more objects than startRound() will actually
      # render. Both were broken and shipped: starting Hard used to be EASIER
      # than finishing Medium on three of four levers.
      - name: Audit Target Tracking difficulty curve
        run: npm run audit:mot

      # Ratchet, not a clean-room check: fails only when design drift gets WORSE
      # than scripts/design-baseline.json. See the header of audit-design.mjs.
      # If this fails, a game gained a hardcoded colour (or similar) — fix it or
      # deliberately raise the ceiling with `npm run audit:design -- --update`.
      # Games are asked for by STRING KEY through getLazyGame(), which returns
      # null for anything unregistered — and every caller then renders nothing,
      # with no error. Three load-bearing games (nback, spatial-stroop,
      # memo-span) have no training-hub slot, so they read as dead code to
      # anyone tidying up. This fails the build instead of failing silently.
      - name: Audit game-key resolution
        run: npm run audit:gamekeys
      # Every live game must end up with a live-board coach tutorial, and the
      # ways one fails are silent: a coach id without its @coachN suffix reuses
      # a flag existing players already stored, so the lesson never auto-runs
      # for them — fresh installs only, nothing on screen, no error. This also
      # keeps the waiting list honest as COACH-PLAN.md's phases land.
      - name: Audit training coach coverage
        run: npm run audit:coach
      - name: Audit design drift (ratchet)
        run: npm run audit:design

      - name: Build
        run: npm run build

      - name: Publish dist/ to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/site origin/gh-pages

          # gh-pages is deliberately NOT wiped on each deploy.
          #
          # Vite content-hashes every JS/CSS chunk, so a deploy that deleted the
          # previous build's files left every already-open tab — and every
          # installed PWA still holding the old index.html — requesting chunks
          # that now 404. When the missing one is the ENTRY chunk the page cannot
          # boot at all: React and the ErrorBoundary live inside it, so there is
          # no in-app recovery, just a dead screen until the service worker
          # happens to update. (Confirmed live 2026-07-26: the precached shell
          # pointed at Assets/index-BHkJm4nN.js, already 404 on the server.)
          #
          # So: keep the last two builds' files alive and prune only what has
          # been absent for that long. .deploy-manifest{,.prev} are the ledger —
          # dot-prefixed, so GitHub Pages never serves them.
          ( cd dist && find . -type f | sed 's|^\./||' | LC_ALL=C sort ) > /tmp/build-now.txt

          if [ -f /tmp/site/.deploy-manifest ]; then
            LC_ALL=C sort /tmp/site/.deploy-manifest > /tmp/build-prev1.txt
          else
            # First deploy under this scheme: there is no ledger yet, so treat
            # everything currently published as the previous build. Without this
            # the changeover deploy would still delete the chunks live clients
            # are holding — the exact failure this step exists to prevent.
            ( cd /tmp/site && find . -type f -not -path './.git/*' | sed 's|^\./||' \
              | LC_ALL=C sort ) > /tmp/build-prev1.txt
          fi
          if [ -f /tmp/site/.deploy-manifest.prev ]; then
            LC_ALL=C sort /tmp/site/.deploy-manifest.prev > /tmp/build-prev2.txt
          else
            : > /tmp/build-prev2.txt
          fi

          { cat /tmp/build-now.txt /tmp/build-prev1.txt /tmp/build-prev2.txt
            printf '.deploy-manifest\n.deploy-manifest.prev\n'
          } | LC_ALL=C sort -u > /tmp/keep.txt
          # `-not -path './.git'` is load-bearing, NOT redundant with the glob
          # below it. In a worktree /tmp/site/.git is a FILE, not a directory,
          # so './.git/*' does not match it — .git landed in the published list,
          # was absent from keep, and the prune loop deleted the worktree's link
          # to the repo. It stayed invisible for two deploys because both pruned
          # nothing; the first real prune killed the job (2026-07-26).
          ( cd /tmp/site && find . -type f -not -path './.git' -not -path './.git/*' \
            | sed 's|^\./||' | LC_ALL=C sort ) > /tmp/published.txt
          comm -23 /tmp/published.txt /tmp/keep.txt > /tmp/prune.txt
          echo "Publishing $(wc -l < /tmp/build-now.txt) file(s); pruning $(wc -l < /tmp/prune.txt) stale for two builds."
          while IFS= read -r stale; do
            # Belt and braces: never let a bad list take out the git plumbing.
            case "$stale" in '' | .git | .git/* | ../* | /*) continue ;; esac
            rm -f "/tmp/site/$stale"
          done < /tmp/prune.txt

          cp -r dist/. /tmp/site/
          cp /tmp/build-prev1.txt /tmp/site/.deploy-manifest.prev
          cp /tmp/build-now.txt /tmp/site/.deploy-manifest

          cd /tmp/site
          git add -A
          if git diff --cached --quiet; then
            echo "Build is identical to the live site — nothing to deploy."
          else
            git commit -m "Deploy: built from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
