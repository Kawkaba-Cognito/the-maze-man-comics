<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Light Planet Move Test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050510; font-family: system-ui, sans-serif; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: fixed; left: 0; right: 0; top: 0; z-index: 5;
      padding: 12px; text-align: center; pointer-events: none;
      color: #9be8ff; font-size: 15px;
    }
    #ui b { color: #e8ac4e; }
    #hint {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 5; pointer-events: none;
      background: rgba(8,10,28,.8); border: 1px solid rgba(232,172,78,.45);
      color: #f0e2c0; padding: 8px 14px; border-radius: 999px; font-size: 13px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">loading image...</div>
  <div id="hint">Click ground, press arrows, or tap <b>MOVE</b></div>
  <button id="moveBtn" type="button">MOVE</button>
  <style>
    #moveBtn {
      position: fixed; right: 16px; bottom: 16px; z-index: 6;
      padding: 12px 18px; border-radius: 12px; border: 1px solid #e8ac4e;
      background: #1a1430; color: #ffe0a0; font-weight: 700; font-size: 14px;
      cursor: pointer;
    }
    #moveBtn:active { transform: scale(0.97); }
  </style>

  <script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const ui = document.getElementById('ui');
const setUI = (t) => { ui.innerHTML = t; };

const N = 2000;
const DISSOLVE = 2.0; // seconds
const REFORM = 1.8;
const SPEED = 1.6; // units/sec

let mode = 'idle'; // idle | dissolve | travel | reform
let t0 = 0;
let from = new THREE.Vector3();
let to = new THREE.Vector3();
let travelDur = 1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 7, 11);
camera.lookAt(0, 1.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.15, 0.5, 0.2));

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({ color: 0x14182c, emissive: 0x182040, emissiveIntensity: 0.5, roughness: 0.9 }),
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const grid = new THREE.GridHelper(20, 20, 0x3a4568, 0x1c2238);
grid.position.y = 0.02;
scene.add(grid);

scene.add(new THREE.AmbientLight(0x556688, 0.8));
scene.add(new THREE.PointLight(0xffe0a0, 2.5, 30).translateY(6));

const goal = new THREE.Mesh(
  new THREE.RingGeometry(0.3, 0.5, 48),
  new THREE.MeshBasicMaterial({ color: 0xe8ac4e, transparent: true, opacity: 0, side: THREE.DoubleSide }),
);
goal.rotation.x = -Math.PI / 2;
goal.position.y = 0.03;
scene.add(goal);

// --- load concept art ---
const IMG = new URL('./light-planet-character-concept.png', import.meta.url).href;

function punchAlpha(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const id = ctx.getImageData(0, 0, c.width, c.height);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const lum = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    if (lum < 30) d[i + 3] = 0;
    else if (lum < 60) d[i + 3] = Math.round(d[i + 3] * ((lum - 30) / 30));
  }
  ctx.putImageData(id, 0, 0);
  return c;
}

function sampleBright(canvas, count) {
  const size = 80;
  const s = document.createElement('canvas');
  s.width = size; s.height = size;
  const ctx = s.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(canvas, 0, 0, size, size);
  const data = ctx.getImageData(0, 0, size, size).data;
  const pts = [];
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      if (data[i + 3] < 70) continue;
      const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      if (lum < 0.25) continue;
      pts.push({
        x: ((x / (size - 1)) - 0.5) * 2.0,
        y: (1 - y / (size - 1)) * 2.7,
        z: (Math.random() - 0.5) * 0.15,
        r, g, b,
      });
    }
  }
  if (!pts.length) throw new Error('no bright pixels');
  const out = [];
  for (let i = 0; i < count; i++) out.push(pts[(Math.random() * pts.length) | 0]);
  return out;
}

const img = await new Promise((res, rej) => {
  const el = new Image();
  el.onload = () => res(el);
  el.onerror = rej;
  el.src = IMG;
});

const punched = punchAlpha(img);
const tex = new THREE.CanvasTexture(punched);
tex.colorSpace = THREE.SRGBColorSpace;
const aspect = punched.width / punched.height;
const H = 2.9;
const W = H * aspect;

const spriteMat = new THREE.MeshBasicMaterial({
  map: tex, transparent: true, alphaTest: 0.1, depthWrite: false, toneMapped: false,
});
const sprite = new THREE.Mesh(new THREE.PlaneGeometry(W, H), spriteMat);
sprite.position.y = H * 0.5;

const root = new THREE.Group();
root.add(sprite);
scene.add(root);

const samples = sampleBright(punched, N);
const rest = new Float32Array(N * 3);
const col = new Float32Array(N * 3);
const burst = new Float32Array(N * 3);
const aPos = new Float32Array(N * 3);
const bPos = new Float32Array(N * 3);
const cur = new Float32Array(N * 3);

for (let i = 0; i < N; i++) {
  const s = samples[i];
  rest[i * 3] = s.x; rest[i * 3 + 1] = s.y; rest[i * 3 + 2] = s.z;
  col[i * 3] = s.r; col[i * 3 + 1] = s.g; col[i * 3 + 2] = s.b;
  burst[i * 3] = (Math.random() - 0.5) * 3.5;
  burst[i * 3 + 1] = Math.random() * 3.0 + 0.4;
  burst[i * 3 + 2] = (Math.random() - 0.5) * 3.5;
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(cur, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.2, vertexColors: true, transparent: true, opacity: 0,
  depthWrite: false, blending: THREE.AdditiveBlending,
}));
points.visible = false;
scene.add(points);

function fillShape(out, cx, cz) {
  for (let i = 0; i < N; i++) {
    out[i * 3] = cx + rest[i * 3];
    out[i * 3 + 1] = rest[i * 3 + 1];
    out[i * 3 + 2] = cz + rest[i * 3 + 2];
  }
}

function ease(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

function goTo(x, z) {
  if (mode !== 'idle') return;
  from.set(root.position.x, 0, root.position.z);
  to.set(x, 0, z);
  const dist = from.distanceTo(to);
  if (dist < 0.8) {
    const ang = Math.atan2(z - from.z || 0.2, x - from.x || 1);
    to.x = from.x + Math.cos(ang) * 3;
    to.z = from.z + Math.sin(ang) * 3;
  }
  travelDur = Math.max(0.9, from.distanceTo(to) / SPEED);
  goal.position.set(to.x, 0.03, to.z);
  goal.material.opacity = 1;

  fillShape(aPos, from.x, from.z);
  cur.set(aPos);
  pGeo.attributes.position.needsUpdate = true;

  sprite.visible = false;
  points.visible = true;
  points.material.opacity = 1;
  points.material.size = 0.22;

  mode = 'dissolve';
  t0 = performance.now();
  setUI('<b>DISSOLVING</b> into light...');
}

// pointer
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hit = new THREE.Vector3();

function onPointer(cx, cy) {
  pointer.x = (cx / innerWidth) * 2 - 1;
  pointer.y = -(cy / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(ground);
  let p = hits[0]?.point;
  if (!p && raycaster.ray.intersectPlane(plane, hit)) p = hit;
  if (!p) return;
  const r = Math.hypot(p.x, p.z);
  if (r > 9) { p.x *= 9 / r; p.z *= 9 / r; }
  goTo(p.x, p.z);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  onPointer(e.clientX, e.clientY);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(root.position.x + 3.5, root.position.z);
  if (e.key === 'ArrowLeft') goTo(root.position.x - 3.5, root.position.z);
  if (e.key === 'ArrowUp') goTo(root.position.x, root.position.z - 3.5);
  if (e.key === 'ArrowDown') goTo(root.position.x, root.position.z + 3.5);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

setUI('ready — click ground / MOVE / arrows');

document.getElementById('moveBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  goTo(root.position.x + 3.2, root.position.z - 1.2);
});

// Start dissolve immediately so the effect is visible without waiting
goTo(3.5, -1.5);

const camTarget = new THREE.Vector3();
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  const t = now * 0.001;

  sprite.quaternion.copy(camera.quaternion);
  if (mode === 'idle') {
    sprite.position.y = H * 0.5 + Math.sin(t * 2) * 0.05;
  }

  if (mode === 'dissolve') {
    const u = Math.min(1, (now - t0) / (DISSOLVE * 1000));
    const e = ease(u);
    for (let i = 0; i < N; i++) {
      const i3 = i * 3;
      cur[i3] = aPos[i3] + burst[i3] * e;
      cur[i3 + 1] = aPos[i3 + 1] + burst[i3 + 1] * e;
      cur[i3 + 2] = aPos[i3 + 2] + burst[i3 + 2] * e;
    }
    pGeo.attributes.position.needsUpdate = true;
    points.material.size = 0.2 + e * 0.15;
    if (u >= 1) {
      aPos.set(cur);
      fillShape(bPos, to.x, to.z);
      mode = 'travel';
      t0 = now;
      setUI('<b>TRAVELING</b> as light particles...');
    }
  } else if (mode === 'travel') {
    const u = Math.min(1, (now - t0) / (travelDur * 1000));
    const e = ease(u);
    root.position.x = THREE.MathUtils.lerp(from.x, to.x, e);
    root.position.z = THREE.MathUtils.lerp(from.z, to.z, e);
    for (let i = 0; i < N; i++) {
      const i3 = i * 3;
      // fly toward destination shape, keep some scatter mid-flight
      const scatter = (1 - e) * 0.55;
      cur[i3] = THREE.MathUtils.lerp(aPos[i3], bPos[i3], e) + burst[i3] * scatter * 0.35;
      cur[i3 + 1] = THREE.MathUtils.lerp(aPos[i3 + 1], bPos[i3 + 1], e) + burst[i3 + 1] * scatter * 0.25;
      cur[i3 + 2] = THREE.MathUtils.lerp(aPos[i3 + 2], bPos[i3 + 2], e) + burst[i3 + 2] * scatter * 0.35;
    }
    pGeo.attributes.position.needsUpdate = true;
    if (u >= 1) {
      root.position.x = to.x;
      root.position.z = to.z;
      aPos.set(cur);
      mode = 'reform';
      t0 = now;
      setUI('<b>REUNITING</b> into character...');
    }
  } else if (mode === 'reform') {
    const u = Math.min(1, (now - t0) / (REFORM * 1000));
    const e = ease(u);
    for (let i = 0; i < N; i++) {
      const i3 = i * 3;
      cur[i3] = THREE.MathUtils.lerp(aPos[i3], bPos[i3], e);
      cur[i3 + 1] = THREE.MathUtils.lerp(aPos[i3 + 1], bPos[i3 + 1], e);
      cur[i3 + 2] = THREE.MathUtils.lerp(aPos[i3 + 2], bPos[i3 + 2], e);
    }
    pGeo.attributes.position.needsUpdate = true;
    points.material.opacity = 1 - e * 0.95;
    points.material.size = 0.32 - e * 0.12;
    goal.material.opacity = 1 - e;
    if (u >= 1) {
      points.visible = false;
      sprite.visible = true;
      goal.material.opacity = 0;
      mode = 'idle';
      setUI('ready — click ground / MOVE / arrows');
    }
  }

  camTarget.set(root.position.x, 7, root.position.z + 11);
  camera.position.lerp(camTarget, 0.06);
  camera.lookAt(root.position.x, 1.2, root.position.z);
  goal.rotation.z += 0.02;
  composer.render();
}

tick();
  </script>
</body>
</html>
