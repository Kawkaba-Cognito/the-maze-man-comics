<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="decoGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67c2e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#dfbe6f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#996e20" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="decoRadiance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfbe6f" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#dfbe6f" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#dfbe6f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Golden Center Warmth -->
  <circle cx="500" cy="350" r="350" fill="url(#decoRadiance)"/>

  <!-- Radiating Architectural Ray Lines (24 rays) -->
  <g stroke="url(#decoGold)" stroke-width="0.8" opacity="0.35">
    <line x1="500" y1="350" x2="500" y2="20"/>
    <line x1="500" y1="350" x2="500" y2="680"/>
    <line x1="500" y1="350" x2="30" y2="350"/>
    <line x1="500" y1="350" x2="970" y2="350"/>
    <line x1="500" y1="350" x2="160" y2="70"/>
    <line x1="500" y1="350" x2="840" y2="70"/>
    <line x1="500" y1="350" x2="160" y2="630"/>
    <line x1="500" y1="350" x2="840" y2="630"/>
    <line x1="500" y1="350" x2="330" y2="30"/>
    <line x1="500" y1="350" x2="670" y2="30"/>
    <line x1="500" y1="350" x2="330" y2="670"/>
    <line x1="500" y1="350" x2="670" y2="670"/>
    <line x1="500" y1="350" x2="60" y2="200"/>
    <line x1="500" y1="350" x2="940" y2="200"/>
    <line x1="500" y1="350" x2="60" y2="500"/>
    <line x1="500" y1="350" x2="940" y2="500"/>
  </g>

  <!-- Art Deco Concentric Diamond & Hexagon Crests -->
  <g stroke="url(#decoGold)" stroke-width="1.2" opacity="0.6">
    <polygon points="500,70 780,350 500,630 220,350"/>
    <polygon points="500,90 760,350 500,610 240,350" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.4"/>
    <polygon points="500,160 690,350 500,540 310,350" stroke-width="1.0" opacity="0.5"/>
  </g>

  <!-- Interlocking Fan Arches (Editorial Luxury Motifs) -->
  <g stroke="url(#decoGold)" stroke-width="1.1" opacity="0.55">
    <circle cx="500" cy="350" r="330"/>
    <circle cx="500" cy="350" r="230"/>
    <circle cx="500" cy="350" r="130" stroke-width="1.6"/>
  </g>

  <!-- Corner Art Deco Geometric Stepped Friezes -->
  <g stroke="url(#decoGold)" stroke-width="1.2" opacity="0.55">
    <!-- Top-Left -->
    <path d="M 40,40 L 160,40 L 160,60 L 100,60 L 100,120 L 60,120 L 60,160 L 40,160 Z"/>
    <line x1="40" y1="40" x2="120" y2="120"/>
    <!-- Top-Right -->
    <path d="M 960,40 L 840,40 L 840,60 L 900,60 L 900,120 L 940,120 L 940,160 L 960,160 Z"/>
    <line x1="960" y1="40" x2="880" y2="120"/>
    <!-- Bottom-Left -->
    <path d="M 40,660 L 160,660 L 160,640 L 100,640 L 100,580 L 60,580 L 60,540 L 40,540 Z"/>
    <line x1="40" y1="660" x2="120" y2="580"/>
    <!-- Bottom-Right -->
    <path d="M 960,660 L 840,660 L 840,640 L 900,640 L 900,580 L 940,580 L 940,540 L 960,540 Z"/>
    <line x1="960" y1="660" x2="880" y2="580"/>
  </g>
</svg>
