<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich metallic gold gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8b6508" stop-opacity="0.80"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="85%" stop-color="#d4af37" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient radial warmth behind hub -->
  <circle cx="500" cy="350" r="380" fill="url(#centerGlow)"/>
  <circle cx="500" cy="350" r="320" fill="url(#ringGlow)"/>

  <!-- Main Concentric Astronomical Rings -->
  <circle cx="500" cy="350" r="460" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.45"/>
  <circle cx="500" cy="350" r="430" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
  <circle cx="500" cy="350" r="350" stroke="url(#goldGrad)" stroke-width="1.6" opacity="0.75"/>
  <circle cx="500" cy="350" r="342" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.4"/>
  <circle cx="500" cy="350" r="260" stroke="url(#goldGrad)" stroke-width="1.1" stroke-dasharray="8 6 2 6" opacity="0.6"/>
  <circle cx="500" cy="350" r="180" stroke="url(#goldGrad)" stroke-width="1.4" opacity="0.7"/>
  <circle cx="500" cy="350" r="172" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.4"/>
  <circle cx="500" cy="350" r="105" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85"/>
  <circle cx="500" cy="350" r="97" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Degree Tick Marks around r=350 -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.65">
    <!-- 72 tick marks around the astrolabe circumference -->
    <!-- Quadrant 1 -->
    <line x1="500" y1="0" x2="500" y2="700" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.3"/>
    <line x1="0" y1="350" x2="1000" y2="350" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.3"/>
    <!-- Diagonal crosshairs -->
    <line x1="150" y1="0" x2="850" y2="700" stroke-width="0.6" stroke-dasharray="2 6" opacity="0.25"/>
    <line x1="150" y1="700" x2="850" y2="0" stroke-width="0.6" stroke-dasharray="2 6" opacity="0.25"/>
  </g>

  <!-- Central 16-point Astrolabe Compass Rose -->
  <g transform="translate(500,350)" opacity="0.65">
    <!-- Compass Points -->
    <polygon points="0,-95 7,-25 0,-15 -7,-25" fill="url(#goldGrad)"/>
    <polygon points="0,95 7,25 0,15 -7,25" fill="url(#goldGrad)"/>
    <polygon points="-95,0 -25,-7 -15,0 -25,7" fill="url(#goldGrad)"/>
    <polygon points="95,0 25,-7 15,0 25,7" fill="url(#goldGrad)"/>

    <polygon points="-67,-67 -22,-12 -11,-11 -12,-22" fill="url(#goldGrad)" opacity="0.75"/>
    <polygon points="67,-67 12,-22 11,-11 22,-12" fill="url(#goldGrad)" opacity="0.75"/>
    <polygon points="-67,67 -22,12 -11,11 -12,22" fill="url(#goldGrad)" opacity="0.75"/>
    <polygon points="67,67 22,12 11,11 12,22" fill="url(#goldGrad)" opacity="0.75"/>
  </g>

  <!-- Ecliptic Tilted Orbit Arcs (Armillary Sphere illusion) -->
  <ellipse cx="500" cy="350" rx="390" ry="180" transform="rotate(-22 500 350)" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.55"/>
  <ellipse cx="500" cy="350" rx="390" ry="180" transform="rotate(22 500 350)" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.45"/>
  <ellipse cx="500" cy="350" rx="440" ry="120" transform="rotate(68 500 350)" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="5 5" opacity="0.35"/>

  <!-- Delicate Corner Astrolabe Brackets -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.5">
    <!-- Top-Left Corner -->
    <path d="M 40,90 A 50,50 0 0,1 90,40 L 140,40 M 40,140 L 40,90"/>
    <circle cx="90" cy="90" r="14" fill="none" stroke-width="0.8"/>
    <circle cx="90" cy="90" r="2.5" fill="url(#goldGrad)"/>
    <!-- Top-Right Corner -->
    <path d="M 960,90 A 50,50 0 0,0 910,40 L 860,40 M 960,140 L 960,90"/>
    <circle cx="910" cy="90" r="14" fill="none" stroke-width="0.8"/>
    <circle cx="910" cy="90" r="2.5" fill="url(#goldGrad)"/>
    <!-- Bottom-Left Corner -->
    <path d="M 40,610 A 50,50 0 0,0 90,660 L 140,660 M 40,560 L 40,610"/>
    <circle cx="90" cy="610" r="14" fill="none" stroke-width="0.8"/>
    <circle cx="90" cy="610" r="2.5" fill="url(#goldGrad)"/>
    <!-- Bottom-Right Corner -->
    <path d="M 960,610 A 50,50 0 0,1 910,660 L 860,660 M 960,560 L 960,610"/>
    <circle cx="910" cy="610" r="14" fill="none" stroke-width="0.8"/>
    <circle cx="910" cy="610" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Fine Star Crosshairs scattered harmoniously -->
  <g fill="url(#goldGrad)" opacity="0.6">
    <circle cx="210" cy="160" r="2"/>
    <circle cx="790" cy="160" r="2"/>
    <circle cx="210" cy="540" r="2"/>
    <circle cx="790" cy="540" r="2"/>
    <circle cx="340" cy="80" r="2"/>
    <circle cx="660" cy="80" r="2"/>
    <circle cx="340" cy="620" r="2"/>
    <circle cx="660" cy="620" r="2"/>
  </g>
</svg>
