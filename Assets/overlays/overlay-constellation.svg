<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="starInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#805d26" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a67c38" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a421a" stop-opacity="0.70"/>
    </linearGradient>
  </defs>

  <!-- Celestial Coordinate Grid Lines -->
  <g stroke="url(#starInk)" stroke-width="0.7" opacity="0.35">
    <!-- Parallels of Declination -->
    <ellipse cx="500" cy="350" rx="460" ry="240"/>
    <ellipse cx="500" cy="350" rx="380" ry="180"/>
    <ellipse cx="500" cy="350" rx="280" ry="120"/>
    <ellipse cx="500" cy="350" rx="160" ry="60"/>
    <!-- Hour Meridians -->
    <path d="M 500,50 C 650,150 650,550 500,650"/>
    <path d="M 500,50 C 350,150 350,550 500,650"/>
    <path d="M 500,50 C 800,200 800,500 500,650"/>
    <path d="M 500,50 C 200,200 200,500 500,650"/>
    <line x1="500" y1="30" x2="500" y2="670" stroke-dasharray="3 4"/>
    <line x1="30" y1="350" x2="970" y2="350" stroke-dasharray="3 4"/>
  </g>

  <!-- Constellation Formations (Ursa, Orion, Cygnus, Cassiopeia lines) -->
  <g stroke="url(#starInk)" stroke-width="1.1" opacity="0.6">
    <!-- Top-Left Constellation (Ursa Major) -->
    <polyline points="120,120 180,110 240,140 280,170 340,160 360,210 280,220 280,170" stroke-dasharray="2 3"/>
    <!-- Top-Right Constellation (Cassiopeia 'W') -->
    <polyline points="720,110 760,150 800,120 840,160 880,130" stroke-dasharray="2 3"/>
    <!-- Bottom-Left Constellation (Pegasus Square) -->
    <polygon points="140,520 220,500 240,580 160,600" stroke-dasharray="2 3"/>
    <!-- Bottom-Right Constellation (Orion Belt & Shield) -->
    <line x1="780" y1="520" x2="800" y2="540"/>
    <line x1="800" y1="540" x2="820" y2="560"/>
    <polyline points="760,490 800,540 840,590" stroke-dasharray="2 3"/>
  </g>

  <!-- Magnitude Stars (Glowing Star Dots) -->
  <g fill="url(#starInk)" opacity="0.75">
    <!-- Major Star Points -->
    <circle cx="120" cy="120" r="3.2"/>
    <circle cx="180" cy="110" r="2.2"/>
    <circle cx="240" cy="140" r="2.8"/>
    <circle cx="280" cy="170" r="3.5"/>
    <circle cx="340" cy="160" r="2.6"/>
    <circle cx="360" cy="210" r="3.0"/>
    <circle cx="280" cy="220" r="2.4"/>

    <circle cx="720" cy="110" r="3.0"/>
    <circle cx="760" cy="150" r="2.5"/>
    <circle cx="800" cy="120" r="3.4"/>
    <circle cx="840" cy="160" r="2.8"/>
    <circle cx="880" cy="130" r="3.2"/>

    <circle cx="140" cy="520" r="3.0"/>
    <circle cx="220" cy="500" r="2.8"/>
    <circle cx="240" cy="580" r="3.2"/>
    <circle cx="160" cy="600" r="2.6"/>

    <circle cx="780" cy="520" r="3.2"/>
    <circle cx="800" cy="540" r="3.5"/>
    <circle cx="820" cy="560" r="3.2"/>
    <circle cx="760" cy="490" r="3.8"/>
    <circle cx="840" cy="590" r="3.6"/>
  </g>

  <!-- Border Nautical Degree Scales -->
  <g stroke="url(#starInk)" stroke-width="0.8" opacity="0.45">
    <rect x="30" y="30" width="940" height="640" stroke-dasharray="8 4"/>
    <rect x="38" y="38" width="924" height="624" stroke-width="0.4"/>
  </g>
</svg>
